# Ambiente de desenvolvimento e CI. Nada aqui é usado em produção.
services:
  postgres:
    build:
      context: ./docker/postgres
      args:
        PG_MAJOR: "16"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pa_premios
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=pa_premios
      - -c
      - cron.timezone=UTC
      # Workers internos: jobs não dependem de autenticação libpq em localhost.
      - -c
      - cron.use_background_workers=on
      - -c
      - max_worker_processes=32
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pa_premios"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Pooler em modo transação (paridade com o pooler do Supabase).
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./docker/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "6432:6432"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Emula a API REST do Upstash sobre o Redis local.
  redis-http:
    image: hiett/serverless-redis-http:0.0.10
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SRH_MODE: env
      SRH_TOKEN: local-dev-token
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      - "8079:80"

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
