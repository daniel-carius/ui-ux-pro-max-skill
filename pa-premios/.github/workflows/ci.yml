name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      APP_ENV: development
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://pa_app:pa_app@localhost:6432/pa_premios?pgbouncer=true&connection_limit=10
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/pa_premios
      TEST_DATABASE_URL: postgresql://pa_app:pa_app@localhost:6432/pa_premios_test?pgbouncer=true&connection_limit=20
      TEST_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/pa_premios_test
      PG_CRON_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/pa_premios
      UPSTASH_REDIS_REST_URL: http://localhost:8079
      UPSTASH_REDIS_REST_TOKEN: local-dev-token
      CRON_SECRET: ci-only-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Subir Postgres (pg_cron), pooler, Redis e Mailpit
        run: docker compose up -d --build --wait postgres pgbouncer redis redis-http mailpit

      - run: pnpm install --frozen-lockfile

      - name: Formatação, lint e typecheck
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck

      - name: Migrations, drift e seed
        run: |
          pnpm db:deploy
          docker compose exec -T postgres psql -U postgres -c "CREATE DATABASE pa_shadow_check"
          pnpm exec prisma migrate diff --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://postgres:postgres@localhost:5432/pa_shadow_check \
            --exit-code
          pnpm db:seed

      - name: Testes unitários
        run: pnpm test:unit

      - name: Testes de integração (Postgres real + pooler em modo transação)
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: E2E (Playwright, 390x844)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
