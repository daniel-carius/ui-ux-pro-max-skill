# Cabeçalhos de segurança do painel. Incluído no server HTTPS e de novo em TODA location que declara
# add_header própria: o nginx só herda add_header do nível de cima quando o nível atual não declara nenhum.
# Instalado em /etc/nginx/snippets/x2win-security-headers.conf (Dockerfile.web).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# CSP do painel:
#  - script-src: só arquivos do próprio domínio + o script de tema embutido no index.html (hash sha256 do conteúdo;
#    mudou o script, recalcule: o teste server/test/core-deploy.test.ts confere);
#  - style-src/font-src: Google Fonts; 'unsafe-inline' em estilos por causa dos estilos em linha dos componentes;
#  - img-src: imagens enviadas pelo painel chegam como data: URL. Se a operação servir imagens por uma CDN, inclua
#    só o host dela (ex.: https://cdn.seudominio.bet.br), nunca "https:" inteiro;
#  - frame-ancestors 'none': o painel não pode ser exibido em frame (clickjacking), nem por outro subdomínio.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-aP1KgFlK4gM4LtMIop71pu8kxwh++xdJ0w3Q4vf6ELI='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
