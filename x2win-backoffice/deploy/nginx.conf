# Painel + API no mesmo domínio, com o TLS terminado aqui no nginx.
# Certificado do domínio do painel em /etc/nginx/certs (docker-compose.yml monta deploy/certs):
#   fullchain.pem (certificado + intermediários) e privkey.pem (chave privada).

# HTTP só redireciona para HTTPS: senha, código do 2FA e cookie de sessão nunca trafegam em texto claro.
server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:x2w_tls:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # IP real do cliente. Sozinho na borda (padrão), o nginx usa o IP da conexão e a API confia em 1 proxy
  # (TRUST_PROXY=1): o X-Forwarded-For que o cliente mandar é descartado.
  # Atrás de um balanceador ou terminador TLS (opcional): descomente e troque pela faixa do balanceador. O nginx
  # passa a ler o IP do cliente no X-Forwarded-For que o balanceador anexa, só quando a conexão vem dessa faixa,
  # e continua mandando para a API um único IP (TRUST_PROXY continua 1). Sem isso, todos os clientes aparecem com
  # o IP do balanceador e dividem os limites de login/2FA e a lista de IPs do painel.
  # O balanceador deve conectar neste nginx pela porta 443 (HTTPS). Balanceador TCP (sem HTTP): use
  # "listen 443 ssl proxy_protocol;" e "real_ip_header proxy_protocol;".
  # Não troque por $proxy_add_x_forwarded_for com TRUST_PROXY=2: o cliente forjaria o próprio IP.
  # set_real_ip_from 10.0.0.0/8;
  # real_ip_header X-Forwarded-For;
  # real_ip_recursive on;

  # cabeçalhos de segurança (HSTS, CSP, X-Frame-Options...) para tudo que não declara add_header própria
  include /etc/nginx/snippets/x2win-security-headers.conf;

  # arquivos com hash no nome: cache longo
  location /assets/ {
    try_files $uri =404;
    include /etc/nginx/snippets/x2win-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # API no mesmo domínio: o cookie de sessão fica SameSite=Strict
  location /api/ {
    proxy_pass http://api:3333;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # o nginx é a única fonte destes cabeçalhos (sem valores duplicados com os do helmet)
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    client_max_body_size 12m;
  }

  location / {
    try_files $uri /index.html;
    include /etc/nginx/snippets/x2win-security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }
}
