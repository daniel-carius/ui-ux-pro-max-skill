# Painel + API no mesmo domínio, com o TLS terminado aqui no nginx.
# Certificado do domínio do painel em /etc/nginx/certs (docker-compose.yml monta deploy/certs):
#   fullchain.pem (certificado + intermediários) e privkey.pem (chave privada).

# HTTP só redireciona para HTTPS: senha, código do 2FA e cookie de sessão nunca trafegam em texto claro.
server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:x2w_tls:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # IP real do cliente. Sozinho na borda (padrão), o nginx usa o IP da conexão e a API confia em 1 proxy
  # (TRUST_PROXY=1): o X-Forwarded-For que o cliente mandar é descartado.
  # Atrás de um balanceador ou terminador TLS (opcional): descomente e troque pela faixa do balanceador. O nginx
  # passa a ler o IP do cliente no X-Forwarded-For que o balanceador anexa, só quando a conexão vem dessa faixa,
  # e continua mandando para a API um único IP (TRUST_PROXY continua 1). Sem isso, todos os clientes aparecem com
  # o IP do balanceador e dividem os limites de login/2FA e a lista de IPs do painel.
  # O balanceador deve conectar neste nginx pela porta 443 (HTTPS). Balanceador TCP (sem HTTP): use
  # "listen 443 ssl proxy_protocol;" e "real_ip_header proxy_protocol;".
  # Não troque por $proxy_add_x_forwarded_for com TRUST_PROXY=2: o cliente forjaria o próprio IP.
  # set_real_ip_from 10.0.0.0/8;
  # real_ip_header X-Forwarded-For;
  # real_ip_recursive on;

  # cabeçalhos de segurança (HSTS, CSP, X-Frame-Options...) para tudo que não declara add_header própria
  include /etc/nginx/snippets/x2win-security-headers.conf;

  # arquivos com hash no nome: cache longo
  location /assets/ {
    try_files $uri =404;
    include /etc/nginx/snippets/x2win-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # API no mesmo domínio: o cookie de sessão fica SameSite=Strict
  location /api/ {
    # "api" é resolvido pelo DNS do Docker (127.0.0.11) a cada 10 s, não só ao carregar a configuração: o nginx sobe
    # mesmo com a API fora do ar (painel e redirecionamento continuam) e acompanha o contêiner da API recriado com
    # outro IP, sem precisar reiniciar o web. A variável não tem parte de URI: o caminho segue como chegou.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $x2w_api http://api:3333;
    proxy_pass $x2w_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # o nginx é a única fonte destes cabeçalhos (sem valores duplicados com os do helmet)
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    # o mesmo limite da API (bodyLimit de 1 MiB): corpo maior nem chega a ela
    client_max_body_size 1m;
    error_page 413 = @x2w_corpo_grande;
  }

  # Dados por chave (/api/kv/): imagens em data URL e importações de jogadores e extrato, até 12 MiB (o limite das
  # rotas de /api/kv na API). Mesmas regras de /api/ acima, repetidas: uma location não herda as da vizinha.
  # ^~: nenhuma location com regex passa na frente desta.
  location ^~ /api/kv/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $x2w_api http://api:3333;
    proxy_pass $x2w_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    client_max_body_size 12m;
    error_page 413 = @x2w_corpo_grande;
  }

  # corpo acima do limite recusado aqui no nginx: o mesmo erro em JSON que a API devolveria (o painel mostra a mensagem)
  location @x2w_corpo_grande {
    default_type application/json;
    return 413 '{"error":{"code":"corpo_grande_demais","message":"Os dados enviados passam do tamanho permitido."}}';
  }

  location / {
    try_files $uri /index.html;
    include /etc/nginx/snippets/x2win-security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }
}
