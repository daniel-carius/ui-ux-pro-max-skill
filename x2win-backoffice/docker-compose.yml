# Sobe Postgres + API + painel (modo API). Antes, copie deploy/.env.example
# para deploy/.env e preencha os segredos.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: x2win
      POSTGRES_USER: x2win
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U x2win -d x2win"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: deploy/.env
    environment:
      DATABASE_URL: postgres://x2win:${POSTGRES_PASSWORD}@db:5432/x2win
      # o nginx é o único proxy à frente da API
      TRUST_PROXY: "1"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
