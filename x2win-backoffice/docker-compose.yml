# Sobe Postgres + migrações + API + painel (modo API) atrás do nginx com HTTPS. Antes:
#  1. copie deploy/.env.example para deploy/.env e preencha os segredos;
#  2. ponha o certificado do domínio do painel em deploy/certs/fullchain.pem e deploy/certs/privkey.pem.
# Suba com: docker compose --env-file deploy/.env up -d --build
# db, api e web têm restart: unless-stopped: voltam sozinhos depois de um crash e quando o dockerd ou o host
# reiniciam (deixe o Docker ligado no boot: systemctl enable docker). O Compose não reinicia contêiner "unhealthy":
# monitore de fora https://<painel>/api/health (responde 503 quando a API não alcança o banco).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: x2win
      # dono das tabelas (superusuário do contêiner): só o serviço "migrate" usa esta senha
      POSTGRES_USER: x2win
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em deploy/.env}
      # senha do usuário x2win_app, com que a API conecta (criado por deploy/db-init na primeira subida do banco)
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?defina APP_DB_PASSWORD em deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U x2win -d x2win"]
      interval: 5s
      retries: 10

  # migrações com o dono das tabelas, num passo à parte; a API só sobe depois que ele termina bem
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: deploy/.env
    environment:
      DATABASE_URL: postgres://x2win:${POSTGRES_PASSWORD}@db:5432/x2win
    command: ["node", "dist/migrate.js"]
    # passo único: sai com erro se o papel x2win_app não existir (crie-o e suba de novo)
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file: deploy/.env
    environment:
      # papel de execução: não é dono de nenhuma tabela; na auditoria só lê e inclui (sem TRUNCATE nem DDL)
      DATABASE_URL: postgres://x2win_app:${APP_DB_PASSWORD}@db:5432/x2win
      # a senha do dono do banco (lida de deploy/.env) não fica no ambiente da API
      POSTGRES_PASSWORD: ""
      # o nginx é o único proxy à frente da API e só repassa o que chegou por HTTPS
      TRUST_PROXY: "1"
      COOKIE_SECURE: "true"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      # 80 só redireciona para 443 (o redirecionamento usa a porta padrão do HTTPS)
      - "80:80"
      - "443:443"
    volumes:
      # fullchain.pem e privkey.pem do domínio do painel
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - api

volumes:
  pgdata:
